name: Actualité RSS (brouillons)

on:
  # Planification désactivée : l’automatisation principale est Cursor Automations
  # (voir README « Automatisation Cursor » et .cursor/automations/news-drafts.md).
  # schedule:
  #   - cron: "0 8 * * 1,3,5"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run news

      - name: Vérifier les changements dans content/articles
        id: changes
        run: |
          if [ -n "$(git status --porcelain content/articles)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ouvrir une PR avec les brouillons
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore(news): brouillons RSS du pipeline automatique"
          title: "Actualité RSS — nouveaux brouillons"
          body: |
            Brouillons générés par `npm run news` (GitHub Actions).

            **Publication** : reste en local avec `npm run publish <slug>` et confirmation Telegram (`TELEGRAM_BOT_TOKEN` / `TELEGRAM_CHAT_ID` dans `.env.local` — jamais en CI).
          branch: automation/news-drafts
          delete-branch: true
          labels: |
            automation
            editorial
